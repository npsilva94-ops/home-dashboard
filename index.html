<!doctype html>
<html lang="pt"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Casa</title><link rel="stylesheet" href="style.css">
</head><body>
<div class="app">
<header><div><h1 id="greet">Bom dia!</h1><span id="dateText"></span></div><b id="clock"></b></header>
<div id="sync" class="sync">● A ligar…</div>
<main>
<section class="card weather"><h2>Tempo</h2><div id="forecast" class="forecastLines">A carregar…</div></section>
<section class="card agenda"><div class="head"><h2>📅 Agenda</h2><button id="showEvent">+ Evento</button></div><div id="events"></div></section>
<section class="card shopping"><h2>🛒 Lista de compras</h2><div id="shopping" class="list"></div><form id="shoppingForm"><input id="shoppingInput" placeholder="Adicionar item"><button>+</button></form></section>
<section class="card tasks"><h2>✓ Tarefas</h2><div id="tasks" class="list"></div><form id="taskForm"><input id="taskInput" placeholder="Adicionar tarefa"><button>+</button></form></section><section class="card menu"><div class="head"><h2>🍽 Ementa semanal</h2><span class="hint">Toque para editar</span></div><div id="weeklyMenu" class="menuGrid"></div></section>
</main></div>
<div id="modal" class="modal"><div class="modalBox">
<div class="head"><h2 id="eventModalTitle">Novo evento</h2><button type="button" id="closeEvent" class="close">×</button></div><input type="hidden" id="editEventId" value="">
<form id="eventForm">
<label>Dia</label><div class="triple"><select id="day"></select><select id="month"></select><select id="year"></select></div>
<label>Hora</label><div class="double"><select id="hour"></select><select id="minute"></select></div>
<label>Descrição</label><input id="eventText" placeholder="Ex.: Jantar de família" required>
<label>Categoria</label><select id="who"><option value="maryli">● Maryli</option><option value="lourenco">● Lourenço</option><option value="nuno">● Nuno</option><option value="casa">● Casa</option></select><label>Repetição</label><select id="repeat"><option value="none">Não repetir</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option></select>
<button id="saveEvent" class="save">Guardar evento</button>
</form></div></div>
<script src="app.js"></script></body></html>
