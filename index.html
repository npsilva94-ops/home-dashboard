<!doctype html>
<html lang="pt"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Casa</title><link rel="stylesheet" href="style.css">



<!-- V7.1 Casa — iOS antigo + iOS atual + Android -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Casa">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Casa">
<meta name="theme-color" content="#102747">
<link rel="apple-touch-icon-precomposed" href="./apple-touch-icon-precomposed.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="57x57" href="./apple-touch-icon-57x57.png">
<link rel="apple-touch-icon" sizes="72x72" href="./apple-touch-icon-72x72.png">
<link rel="apple-touch-icon" sizes="76x76" href="./apple-touch-icon-76x76.png">
<link rel="apple-touch-icon" sizes="114x114" href="./apple-touch-icon-114x114.png">
<link rel="apple-touch-icon" sizes="120x120" href="./apple-touch-icon-120x120.png">
<link rel="apple-touch-icon" sizes="144x144" href="./apple-touch-icon-144x144.png">
<link rel="apple-touch-icon" sizes="152x152" href="./apple-touch-icon-152x152.png">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-180x180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png">
<link rel="manifest" href="./manifest.json">
</head><body>
<div class="app">
<header><div class="welcome"><span class="homeMark">⌂</span><div><h1 id="greet">Bom dia!</h1><span id="dateText"></span></div></div><div class="headerRight"><b id="clock"></b><span id="sync" class="sync" title="Estado da sincronização">●</span></div></header>
<main>
<section class="card weather"><div class="head"><h2><span class="sectionIcon">☀</span> Tempo</h2><span id="weatherUpdated" class="weatherUpdated"></span></div><div id="forecast" class="forecastLines">A carregar…</div></section>
<section class="card agenda"><div class="head"><h2><span class="sectionIcon">📅</span> Agenda</h2><button id="showEvent">+ Evento</button></div><div id="events"></div></section>
<section class="card shopping"><div class="head"><h2><span class="sectionIcon">☷</span> Lista de compras</h2><button id="exportShopping" class="exportBtn">PDF</button></div><div id="shopping" class="list"></div><form id="shoppingForm"><input id="shoppingInput" placeholder="Adicionar item"><button>+</button></form></section>
<section class="card tasks"><h2><span class="sectionIcon">✓</span> Tarefas</h2><div id="tasks" class="list"></div><form id="taskForm"><input id="taskInput" placeholder="Adicionar tarefa"><button>+</button></form></section><section class="card menu"><div class="head"><h2><span class="sectionIcon">🍽</span> Ementa semanal</h2><span class="hint">Toque para editar</span></div><div id="weeklyMenu" class="menuGrid"></div></section>

<section class="card expenses">
 <div class="head expenseHead">
  <h2><span class="sectionIcon">€</span> Despesas do mês</h2>
  <div class="monthNav"><button id="expensePrev" type="button">‹</button><b id="expenseMonth"></b><button id="expenseNext" type="button">›</button></div>
  <button id="showExpense" type="button" class="expenseAdd">+ Despesa</button>
 </div>
 <div class="expenseLayout">
  <div class="expenseLeft"><div id="expenseList" class="expenseList"></div></div>
  <div class="expenseSummary">
   <div class="expenseTotalLabel">Total gasto</div><div id="expenseTotal" class="expenseTotal">0,00 €</div>
   <div class="pieWrap"><svg id="expensePie" class="expensePie" viewBox="0 0 42 42"></svg></div>
   <div id="expenseLegend" class="expenseLegend"></div>
  </div>
 </div>
</section>

</main></div>
<div id="modal" class="modal"><div class="modalBox">
<div class="head"><h2 id="eventModalTitle">Novo evento</h2><button type="button" id="closeEvent" class="close">×</button></div><input type="hidden" id="editEventId" value="">
<form id="eventForm">
<label>Dia</label><div class="triple"><select id="day"></select><select id="month"></select><select id="year"></select></div>
<label>Hora</label><div class="double"><select id="hour"></select><select id="minute"></select></div>
<label>Descrição</label><input id="eventText" placeholder="Ex.: Jantar de família" required>
<label>Categoria</label><select id="who"><option value="maryli">● Maryli</option><option value="lourenco">● Lourenço</option><option value="nuno">● Nuno</option><option value="casa">● Casa</option></select><label>Repetição</label><select id="repeat"><option value="none">Não repetir</option><option value="weekly">Semanal</option><option value="monthly">Mensal</option></select>
<button id="saveEvent" class="save">Guardar evento</button>
</form></div></div>

<div id="expenseModal" class="modal">
 <div class="modalBox">
  <div class="head"><h2 id="expenseModalTitle">Nova despesa</h2><button type="button" id="closeExpense" class="close">×</button></div>
  <form id="expenseForm">
   <input type="hidden" id="editExpenseId">
   <label>Data</label><input id="expenseDate" type="date" required>
   <label>Descrição</label><input id="expenseText" type="text" maxlength="80" placeholder="Ex.: supermercado, eletricidade…" required>
   <label>Valor (€)</label><input id="expenseValue" type="number" min="0.01" step="0.01" required>
   <label>Categoria</label>
   <select id="expenseCategory">
    <option value="credit">Crédito</option><option value="supermarket">Supermercado</option>
    <option value="house">Casa</option><option value="leisure">Lazer</option>
    <option value="restaurant">Restauração</option><option value="other">Outros</option>
   </select>
   <button id="saveExpense" class="save" type="submit">Guardar despesa</button>
  </form>
 </div>
</div>

<script src="app.js"></script></body></html>
